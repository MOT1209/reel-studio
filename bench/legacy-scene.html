<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,">
<style>@font-face{font-family:Cairo;src:url(/Cairo-VF.ttf);font-weight:200 1000}body{margin:0;background:#0C1014}</style>
<canvas id="c" width="720" height="1280"></canvas>
<script>
// Same scene as bench/remotion-poc/src/Scene.jsx: gradient bg, sliding Arabic title, mixed AR/EN line, counting number.
const q = new URLSearchParams(location.search), CW = Number(q.get('w')) || 720, CH = Number(q.get('h')) || 1280, K = CW / 720;
const c = document.getElementById('c'); c.width = CW; c.height = CH; const x = c.getContext('2d');
const ease = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
window.drawFrame = (t) => {
  x.setTransform(K, 0, 0, K, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, 1280); g.addColorStop(0, '#0C1014'); g.addColorStop(1 , '#1b2a3a'); x.fillStyle = g; x.fillRect(0, 0, 720, 1280);
  x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const p = ease(t / 1.2);
  x.globalAlpha = p; x.fillStyle = '#F4F3EE'; x.font = '800 72px Cairo'; x.fillText('ليه السما لونها أزرق؟', 360 + (1 - p) * 300, 360);
  const q = ease((t - 1) / 1.2);
  x.globalAlpha = q; x.fillStyle = '#27B8C7'; x.font = '700 48px Cairo'; x.fillText('الـ DNA polymerase بيعمل نسخة', 360, 560 + (1 - q) * 80);
  x.globalAlpha = 1; x.fillStyle = '#F28A30'; x.font = '800 120px Cairo'; x.fillText(String(Math.round(ease(t / 8) * 300000)).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]), 360, 860);
  x.fillStyle = '#5978FF'; x.fillRect(60, 1100, 600 * ((t % 10) / 10), 14);
};
document.fonts.load('800 72px Cairo').then(() => document.fonts.ready).then(() => { window.drawFrame(0); window.__ready = true; });
</script>
